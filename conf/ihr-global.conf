[main]

[io]
# Options for the traceroute producer/consumer
reader=kafkareader
kafka_topic=ihr_atlas_traceroutev4

# Analyze the last time window if no start/stop time specified
start = 
stop = 

# Fetch data by chunks of chunk_size seconds. Set a smaller value if you have
# memory problems
chunk_size = 300
# msm_ids and probe_ids are ignored by kafkareader
msm_ids = 
probe_ids = 

# Options for the output
saver=kafkasaver
results = ihr_raclette_diffrtt
log = log/ihr_raclette.log

[timetrack]
converter = allin_cy

[tracksaggregator]
window_size = 1800
significance_level = 0.05
# ignore links visited by small number of tracks/traceroutes
min_tracks = 8 

[anomalydetector]
enable = 0 

[lib]
# Get IP to ASN and IP to IXP mappings from the Internet Yellow Pages
# (bgpkit.pfx2as and peeringdb.ix datasets). Set to 'file' to read the local
# databases given below instead.
ip2asn_source = iyp

# Only used when ip2asn_source is not 'iyp'
ip2asn_directory = /home/ihr/github/ip2asn/
ip2asn_db = /home/ihr/github/ip2asn/db/rib.20240501.pickle.bz2
ip2asn_ixp = /home/ihr/github/ip2asn/ix/ixs_202410.jsonl
ip2asn_kafka_topic = ihr_ip2asn

